name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install dependencies
        run: npm ci

      - name: Frontend type checks
        run: npm run check-types

      - name: Frontend lint
        run: npm run lint

      - name: Backend tests
        run: ./mvnw test
        working-directory: backend/fluento-api
